<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark Companies | Vi-Jon Associate Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --ink:#141416; --char:#1d1d21; --gold:#d4a72c; --gold-deep:#b98f1d;
  --paper:#f1eee6; --card:#ffffff; --line:#ddd7c8; --mut:#6b675c;
  /* ANSI signage palette */
  --danger:#bf372a; --danger-bg:#fbeeec;
  --caution:#e9b10c; --caution-ink:#231f10;
  --notice:#1f6fb2; --notice-bg:#ecf3fa;
  --safe:#2e7d46; --safe-bg:#ecf6ef;
  --warn:#d97e1e;
  --r:6px;
  --stripe:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--gold) 10px 20px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Jost',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:17px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:17px}
.mono{font-family:'IBM Plex Mono',monospace}
.sign-type{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em}

/* ---------- header + hazard rail ---------- */
header{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.cobrand{background:#fff;display:flex;align-items:center;gap:15px;padding:9px 18px;box-shadow:4px 4px 0 var(--gold)}
.cobrand img{height:32px;width:auto;display:block}
.cobrand img.cb-vj{height:36px}
.cb-div{width:1.5px;height:32px;background:#e2ded2}
@media(max-width:560px){.cobrand img{height:22px}.cobrand img.cb-vj{height:26px}.cb-div{height:22px}.cobrand{padding:6px 11px;gap:10px}}
.hazard{height:8px;background:var(--stripe)}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{width:36px;height:36px;flex:none}
.brand-name{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.2em;font-size:15px;text-transform:uppercase}
.brand-sub{font-weight:300;font-size:12.5px;letter-spacing:.08em;color:#c9c3b2;display:block;margin-top:1px;text-transform:uppercase}
.lang-toggle{display:flex;border:1px solid #3d3d43;overflow:hidden}
.lang-toggle button{background:none;border:none;color:#b9b4a6;font-family:'Oswald',sans-serif;font-size:13px;font-weight:500;padding:7px 15px;letter-spacing:.12em}
.lang-toggle button.on{background:var(--gold);color:var(--ink)}

/* ---------- stepper: line stations ---------- */
.stepper{background:var(--char);padding:0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.stepper-inner{display:flex;align-items:center;min-width:720px;max-width:1000px;margin:0 auto;padding:15px 6px 13px}
.station{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:82px}
.station .dot{width:28px;height:28px;border:2px solid #4a4a50;background:var(--char);display:flex;align-items:center;justify-content:center;color:#8b8778;font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;transition:all .25s}
.station .lbl{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8778;font-weight:500;text-align:center;line-height:1.2;transition:color .25s}
.station.done .dot{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.station.done .lbl{color:#e5cf7c}
.station.now .dot{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgba(212,167,44,.2)}
.station.now .lbl{color:#fff}
.wire{flex:1;height:2px;background:#3d3d43;min-width:8px;position:relative;top:-11px}
.wire.lit{background:var(--gold)}

main{max-width:800px;margin:0 auto;padding:28px 18px 90px}

/* ---------- placard cards ---------- */
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:0;margin-bottom:20px;overflow:hidden;box-shadow:4px 4px 0 rgba(20,20,22,.12)}
.card-pad{padding:24px 26px}
.signbar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:2px solid var(--ink)}
.signbar .sign-word{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.signbar .sign-note{margin-left:auto;font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:500;white-space:nowrap}
.signbar svg{flex:none}
.sign-danger{background:var(--danger);color:#fff}
.sign-caution{background:var(--caution);color:var(--caution-ink)}
.sign-notice{background:var(--notice);color:#fff}
.sign-safe{background:var(--safe);color:#fff}
.sign-warn{background:var(--warn);color:#fff}
.sign-ink{background:var(--ink);color:var(--gold)}
.mini-stripe{height:6px;background:var(--stripe)}

.eyebrow{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:8px}
h1{font-family:'Oswald',sans-serif;font-size:32px;font-weight:600;line-height:1.1;margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em}
h2{font-family:'Oswald',sans-serif;font-size:25px;font-weight:600;line-height:1.15;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
h3{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.08em}
h3 svg{flex:none;color:var(--gold-deep)}
.sub{color:var(--mut);font-size:15.5px;margin-bottom:16px}
.rule-list{list-style:none;margin:8px 0 4px}
.mod-art{display:block;width:100%;height:auto;margin:12px 0 6px;border:2px solid var(--ink);background:#fff;box-shadow:4px 4px 0 rgba(20,20,22,.12)}
.rule-list li{padding:9px 0 9px 30px;position:relative;border-bottom:1px dashed var(--line);font-size:16px}
.rule-list li:last-child{border-bottom:none}
.rule-list li::before{content:"";position:absolute;left:3px;top:16px;width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.warn-list li::before{background:var(--danger)}
.note{background:#faf3dd;border-left:4px solid var(--gold);padding:12px 16px;font-size:14.5px;color:#5c5232;margin:14px 0}
.pending{background:var(--danger-bg);border-left:4px solid var(--danger);padding:12px 16px;font-size:14.5px;color:#7a2c23;margin:14px 0}
.pending b{font-family:'Oswald',sans-serif;letter-spacing:.1em}

/* ---------- controls ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-family:'Oswald',sans-serif;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:4px;background:#fff;transition:box-shadow .15s}
.field input:focus,.field select:focus{outline:none;box-shadow:3px 3px 0 rgba(212,167,44,.55)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 26px;border-radius:4px;border:2px solid var(--ink);font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:transform .1s, box-shadow .1s;box-shadow:3px 3px 0 rgba(20,20,22,.85)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(20,20,22,.85)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);box-shadow:3px 3px 0 rgba(20,20,22,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn-row{display:flex;gap:14px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.ack{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:14px 16px;margin-top:18px;cursor:pointer;transition:background .15s}
.ack.checked{background:#f7edcf;box-shadow:inset 4px 0 0 var(--gold)}
.ack input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold-deep);flex:none}
.ack span{font-size:15px;font-weight:500}
.listen{background:#fff;border:2px solid var(--ink);border-radius:999px;color:var(--ink);font-family:'Oswald',sans-serif;font-size:12px;font-weight:500;padding:6px 15px;display:inline-flex;align-items:center;gap:7px;letter-spacing:.12em;text-transform:uppercase}
.listen.playing{background:var(--gold)}

/* ---------- badge card (check-in) ---------- */
.badge-card{background:var(--ink);color:#fff;border-radius:10px;padding:0;overflow:hidden;max-width:420px;margin:6px auto 22px;box-shadow:6px 6px 0 rgba(20,20,22,.15)}
.badge-stripe{height:10px;background:var(--stripe)}
.badge-body{display:flex;gap:16px;padding:18px 20px 16px;align-items:center}
.badge-avatar{width:64px;height:64px;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;border-radius:6px;flex:none;letter-spacing:.02em}
.badge-info{min-width:0}
.badge-role{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:3px}
.badge-nm{font-family:'Oswald',sans-serif;font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-meta{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#b8b2a2;margin-top:4px}
.badge-foot{display:flex;justify-content:space-between;padding:8px 20px 12px;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.2em;color:#8b8778;text-transform:uppercase}

/* ---------- module progress ---------- */
.modbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modbar .track{flex:1;height:8px;background:#e5e0d2;border:1.5px solid var(--ink);overflow:hidden}
.modbar .fill{height:100%;background:var(--stripe);transition:width .3s}
.modbar .cnt{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--mut);font-weight:600;text-transform:uppercase;white-space:nowrap}
.kcheck{border:2px solid var(--ink);border-radius:var(--r);padding:16px 18px;margin-top:20px;background:var(--paper)}
.kcheck .kc-lbl{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:7px}
.kcheck .kc-q{font-weight:600;margin-bottom:10px;font-size:16px}
.kc-feedback{font-size:14.5px;font-weight:600;margin-top:6px}
.kc-feedback.ok{color:var(--safe)}
.kc-feedback.no{color:var(--danger)}

/* ---------- quiz ---------- */
.q{border:2px solid var(--ink);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;background:#fff;box-shadow:3px 3px 0 rgba(20,20,22,.1)}
.q-num{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.2em;color:var(--gold-deep);font-weight:600;text-transform:uppercase;margin-bottom:6px}
.q-text{font-weight:600;font-size:16.5px;margin-bottom:12px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:4px;margin-bottom:9px;cursor:pointer;transition:all .12s;font-size:15.5px;background:#fff}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#f7edcf;box-shadow:inset 4px 0 0 var(--gold)}
.opt .key{font-family:'Oswald',sans-serif;font-weight:600;color:var(--gold-deep);flex:none;font-size:14px;width:20px}
.score-wrap{text-align:center;padding:12px 0 4px}
.score-ring{width:150px;height:150px;margin:0 auto 14px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .val b{font-family:'Oswald',sans-serif;font-size:38px;font-weight:600;line-height:1}
.score-ring .val span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.badge-pass{display:inline-block;background:var(--safe);color:#fff;border:2px solid var(--ink);padding:6px 20px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.16em;font-size:14px;text-transform:uppercase}
.badge-fail{display:inline-block;background:var(--danger);color:#fff;border:2px solid var(--ink);padding:6px 20px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.16em;font-size:14px;text-transform:uppercase}

/* ---------- signature ---------- */
.sig-wrap{border:2px solid var(--ink);border-radius:var(--r);background:#fff;position:relative;margin:14px 0 8px}
#sigpad{display:block;width:100%;height:190px;touch-action:none}
.sig-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c5c0b2;font-size:15px;pointer-events:none;letter-spacing:.05em}
.sig-line{position:absolute;left:8%;right:8%;bottom:38px;border-bottom:1.5px solid var(--line);pointer-events:none}
.sig-x{position:absolute;left:4%;bottom:30px;font-family:'Oswald',sans-serif;font-size:20px;color:#c5c0b2;pointer-events:none}

/* ---------- doc text ---------- */
.doc{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:20px 22px;font-size:15.5px;margin:12px 0}
.doc p{margin-bottom:12px}
.doc .donot{color:var(--danger);font-weight:700}
.doc ul{list-style:none;margin:8px 0 14px}
.doc ul li{padding:5px 0 5px 26px;position:relative}
.doc ul li::before{content:"";position:absolute;left:2px;top:11px;width:9px;height:9px;border:2.5px solid var(--danger)}

/* ---------- completion / gate pass ---------- */
.stamp{display:inline-block;border:4px solid var(--safe);color:var(--safe);font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;letter-spacing:.2em;text-transform:uppercase;padding:10px 30px;transform:rotate(-4deg);margin:8px 0 14px}
.stamp.bad{border-color:var(--danger);color:var(--danger)}
.rec{background:var(--ink);color:#e8e4d8;border-radius:8px;padding:0;margin-top:18px;overflow:hidden;text-align:left}
.rec-head{background:var(--stripe);height:8px}
.rec-inner{padding:20px 24px}
.rec h3{color:var(--gold);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.rec-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #2c2c32;font-size:14.5px}
.rec-row:last-child{border:none}
.rec-row .k{color:#9a9585}
.rec-row .v{font-weight:500;text-align:right}
.checkline{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px}
.checkline svg{color:var(--safe);flex:none}

.admin-link{position:fixed;bottom:12px;right:14px;font-size:12px;color:#a39e8f;background:none;border:none;letter-spacing:.08em;font-family:'Oswald',sans-serif;text-transform:uppercase}
.hide{display:none!important}
footer{text-align:center;color:#a39e8f;font-size:12.5px;padding:0 18px 26px;letter-spacing:.04em}
.fadein{animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fadein{animation:none}}
@media print{header,.hazard,.stepper,.btn-row,.admin-link,footer{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="cobrand" aria-label="Spark Companies and Vi-Jon">
      <img id="logoSpark" alt="Spark Companies&reg;">
      <span class="cb-div" aria-hidden="true"></span>
      <img id="logoVijon" class="cb-vj" alt="Vi-Jon">
    </div>
    <div>
      <span class="brand-sub" id="hdrSub" style="margin-left:14px">Vi-Jon Associate Onboarding</span>
    </div>
  </div>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button id="langEN" class="on" onclick="setLang('en')">EN</button>
    <button id="langES" onclick="setLang('es')">ES</button>
  </div>
</header>
<div class="hazard"></div>

<div class="stepper"><div class="stepper-inner" id="stepper"></div></div>

<main id="main"></main>

<footer id="foot">Test build &middot; records held in this session only &middot; Supabase + PDF packet wiring at deploy</footer>
<button class="admin-link" onclick="showAdmin()" id="adminBtn">session records</button>

<script>
/* =========================================================
   Vi-Jon Temporary Associate Onboarding Portal — TEST BUILD v3
   Spark Companies · single-file · in-memory only
   v3: industrial signage design system (ANSI placards,
   hazard rails, facility badge, gate-pass completion).
========================================================= */

const PASS_PCT = 80;
const MAX_ATTEMPTS = 2;
const MODULE_DWELL = 12; // raise for production
const ADMIN_PIN = '2468'; // test build only — becomes MSAL staff login at deploy
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L confusion

const T = {
  en:{ hdrSub:"Vi-Jon Associate Onboarding",
    stations:["Check-In","Orientation","Safety","Gowning","cGMP","Test","Disclosures","Sign-Off"],
    next:"Continue", back:"Back", begin:"Begin orientation",
    understand:"I have read and understand this section.",
    esPending:"Spanish translation pending client approval — content shown in English.",
    required:"Complete all fields to continue.",
    ackAll:"Check each acknowledgment to continue.",
    listen:"Listen", stop:"Stop"},
  es:{ hdrSub:"Incorporación de Asociados Vi-Jon",
    stations:["Registro","Orientación","Seguridad","Vestimenta","cGMP","Examen","Divulgaciones","Firma"],
    next:"Continuar", back:"Atrás", begin:"Comenzar orientación",
    understand:"He leído y entiendo esta sección.",
    esPending:"Traducción al español pendiente de aprobación del cliente — contenido en inglés.",
    required:"Complete todos los campos para continuar.",
    ackAll:"Marque cada reconocimiento para continuar.",
    listen:"Escuchar", stop:"Detener"}
};

let lang = 'en';
let step = 0;
const state = {
  associate:{name:'',badge:'',agency:'Spark Talent Acquisition',shift:'',code:''},
  startedAt:null,
  neo:{module:0, done:[], seconds:{}, checks:{}},
  quiz:{attempts:[],versionsUsed:[],passed:false,finalScore:null,locked:false},
  acks:{}, signature:null, completedAt:null
};
const sessionRecords = [];

/* ---------------- site access code (admin-set, shared) ----------------
   One standing code gates the portal. Spark admin sets/rotates it.
   DEPLOY: stored in Supabase; SEND_WEBHOOK is the Power Automate
   HTTP-trigger URL — every completed record auto-POSTs there
   (record JSON + PDF base64) for SharePoint + email + Salesforce. */
let siteCode = 'VIJON1';
const SEND_WEBHOOK = ''; // Power Automate flow URL at deploy; blank = simulated send in test build
let adminAuthed = false;
function genCode(len=6){ let c=''; for(let i=0;i<len;i++) c += CODE_ALPHABET[Math.floor(Math.random()*CODE_ALPHABET.length)]; return c; }
function normCode(s){ return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

const I = {
  hat:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M2 15h20v3H2z"/><path d="M10 7h4v4h-4z"/></svg>',
  fork:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17V7h7l2 6h4"/><path d="M16 5v12"/><path d="M16 9h5v8"/><circle cx="6" cy="19" r="2"/><circle cx="16" cy="19" r="2"/></svg>',
  gear:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>',
  box:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  shield:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.4 7.7 8 9 4.6-1.3 8-4 8-9V6Z"/></svg>',
  flask:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6L4.5 18a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 9V3"/><path d="M7 15h10"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M4 12.5 9.5 18 20 6.5"/></svg>',

{icon:'drop', sign:{cls:'sign-warn',word:'Warning',note:'Chemical Hazards'}, title:'Hazard Communication (Right to Know)', rules:[

const AUDIO_BASE = 'audio/'; // pre-generated Azure Speech MP3s; browser TTS auto-fallback if a file is missing
let speaking = false, currentAudio = null;
const bestVoice = {en:null, es:null};
function rankVoice(v, target){
  const n = v.name.toLowerCase();
  if(!v.lang.toLowerCase().startsWith(target)) return -1;
  let s = 0;
  if(n.includes('natural')) s += 100;                 // Edge neural voices
  if(n.includes('neural')) s += 90;
  if(n.includes('google')) s += 60;                   // Chrome remote voices
  if(/(aria|jenny|guy|michelle|ava|emma|andrew)/.test(n)) s += 40;
  if(/(dalia|paulina|sabina|camila|jorge|juan|luciana|m\u00f3nica|monica)/.test(n)) s += 40; // strong Spanish voices
  if(/(samantha|karen|daniel|moira)/.test(n)) s += 30;// Apple better voices
  if(n.includes('premium') || n.includes('enhanced')) s += 25;
  if(v.lang === 'en-US') s += 10;
  if(/es-mx/i.test(v.lang)) s += 12;                  // Latin American Spanish preferred
  if(/es-us|es-419/i.test(v.lang)) s += 10;
  if(n.includes('compact')) s -= 40;
  if(/(albert|zarvox|trinoids|whisper|bells|bad news|fred)/.test(n)) s -= 100; // novelty voices
  return s;
}
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  ['en','es'].forEach(L=>{
    bestVoice[L] = vs.map(v=>({v,s:rankVoice(v,L)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s)[0]?.v || null;
  });
}
pickVoice();
if(typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = pickVoice;

function stripHtml(s){ const d=document.createElement('div'); d.innerHTML=s; return d.textContent; }
function cleanForSpeech(s, L='en'){
  return stripHtml(s)
    .replace(/\u00b7/g, '. ')
    .replace(/[\u2022\u25aa]/g,'')
    .replace(/&/g, L==='es' ? ' y ' : ' and ')
    .replace(/\bANSI\b/g,'ANSEE')
    .replace(/\bcGMP('?s)?\b/g,'C G M P$1')
    .replace(/\bMSDS\b/g,'M S D S')
    .replace(/\bSDS\b/g,'S D S')
    .replace(/\bPPE\b/g,'P P E')
    .replace(/\bFDA\b/g,'F D A')
    .replace(/\bSOPs\b/g, L==='es' ? 'S O P' : 'S O peez')
    .replace(/\bCHEP\b/g,'chep')
    .replace(/\s+/g,' ').trim();
}
let speechQueue = [], speechLang = 'en';
function stopSpeech(){
  speechQueue = []; speechSynthesis.cancel();
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  speaking = false;
  document.querySelectorAll('.listen').forEach(b=>{b.classList.remove('playing'); const sp=b.querySelector('span'); if(sp) sp.textContent=T[lang].listen;});
}
function markPlaying(btn){
  speaking = true;
  btn.classList.add('playing');
  btn.querySelector('span').textContent = T[lang].stop;
}
function speakNext(){
  if(!speechQueue.length){ stopSpeech(); return; }
  const u = new SpeechSynthesisUtterance(speechQueue.shift());
  const v = bestVoice[speechLang];
  if(v) u.voice = v;
  u.lang = v ? v.lang : (speechLang==='es' ? 'es-MX' : 'en-US');
  u.rate = .92; u.pitch = 1;
  u.onend = ()=> setTimeout(speakNext, 280);
  u.onerror = stopSpeech;
  speechSynthesis.speak(u);
}
function startTts(btn, text, L='en'){
  pickVoice();
  speechLang = L;
  const clean = cleanForSpeech(text, L);
  speechQueue = (clean.match(/[^.!?]+[.!?]+[\s]?|[^.!?]+$/g) || [clean]).map(s=>s.trim()).filter(s=>s.length>1);
  markPlaying(btn);
  speakNext();
}
/* textLang = the language of the TEXT being read (not the UI toggle).
   Content that exists only in English narrates in English even in ES
   mode — no Spanish-accented English safety scripts. As approved ES
   content lands, call sites pass lang and it speaks Spanish. */
function toggleSpeak(btn, text, key, textLang='en'){
  if(speaking){ stopSpeech(); return; }
  if(AUDIO_BASE && key){
    const a = new Audio(AUDIO_BASE + key + '.mp3');
    a.onended = stopSpeech;
    a.onerror = ()=>{ currentAudio=null; startTts(btn, text, textLang); }; // graceful fallback
    currentAudio = a;
    markPlaying(btn);
    a.play().catch(()=>{ currentAudio=null; startTts(btn, text, textLang); });
    return;
  }
  startTts(btn, text, textLang);
}

let currentTest = null, answers = [], optMaps = [];
function pickVersion(){
  const avail = Object.keys(TESTS).filter(k=>!TESTS[k].pending && !state.quiz.versionsUsed.includes(k));
  const pool = avail.length ? avail : Object.keys(TESTS).filter(k=>!TESTS[k].pending);
  return pool[Math.floor(Math.random()*pool.length)];
}
function shuffle(n){ const a=[...Array(n).keys()]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function renderQuiz(){
  if(state.quiz.passed) return renderQuizResult(true);
  if(state.quiz.locked) return renderQuizLocked();
  const attemptNo = state.quiz.attempts.length + 1;
  if(!currentTest){
    currentTest = pickVersion();
    const qs = TESTS[currentTest].questions;
    answers = new Array(qs.length).fill(null);
    optMaps = qs.map(q=>shuffle(q.o.length));
  }
  const test = TESTS[currentTest];
  let h = `<div class="card fadein">
    <div class="signbar sign-ink"><span class="sign-word">${lang==='es'?'Examen':'Knowledge Test'}</span><span class="sign-note">${PASS_PCT}% to Pass · ${MAX_ATTEMPTS} Attempts Max</span></div>

      <p class="sub">${lang==='es'
        ?`Intento ${attemptNo} de ${MAX_ATTEMPTS} · se requiere ${PASS_PCT}% para aprobar (${Math.ceil(test.questions.length*PASS_PCT/100)} de ${test.questions.length}).`
        :`Attempt ${attemptNo} of ${MAX_ATTEMPTS} · ${PASS_PCT}% required to pass (${Math.ceil(test.questions.length*PASS_PCT/100)} of ${test.questions.length}).`}</p>
      ${esNote()}
      <div class="pending"><b>NOTE:</b> Test #1 rotates into the pool once the file is provided. Versions rotate and answer order shuffles per attempt.</div>
    </div>
  </div>`;
  test.questions.forEach((q,qi)=>{
    h += `<div class="q fadein"><div class="q-num">Question ${qi+1}</div><div class="q-text">${q.q}</div>`;
    optMaps[qi].forEach((origIdx,slot)=>{
      h += `<label class="opt ${answers[qi]===origIdx?'sel':''}" onclick="pick(${qi},${origIdx})"><span class="key">${'ABC'[slot]}.</span><span>${q.o[origIdx]}</span></label>`;
    });

  });

function pick(qi,origIdx){
  answers[qi]=origIdx;
  const y = window.scrollY; renderQuiz(); window.scrollTo({top:y});
}
function gradeTest(){
  const test = TESTS[currentTest];
  const correct = answers.filter((a,i)=>a===test.questions[i].a).length;
  const pct = Math.round(correct/test.questions.length*100);
  const passed = pct >= PASS_PCT;
  state.quiz.attempts.push({version:currentTest, score:correct, total:test.questions.length, pct, passed, at:new Date().toISOString(), answers:[...answers]});
  state.quiz.versionsUsed.push(currentTest);
  if(passed){ state.quiz.passed = true; state.quiz.finalScore = pct; }
  else if(state.quiz.attempts.length >= MAX_ATTEMPTS){ state.quiz.locked = true; }
  currentTest = null; answers = []; optMaps = [];
  renderQuizResult(passed, pct);
  window.scrollTo({top:0});
}

/* ---------------- signature pad ---------------- */
let sigDirty = false, ctx, pad;
function initSigPad(){
  pad = $('sigpad');
  const resize = ()=>{
    const data = sigDirty ? pad.toDataURL() : null;
    pad.width = pad.offsetWidth * 2; pad.height = 380;
    ctx = pad.getContext('2d'); ctx.scale(2,2);
    ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#14141a';
    if(data){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,pad.offsetWidth,190); img.src=data; }
  };
  resize(); window.addEventListener('resize', resize, {once:true});
  let drawing=false, last=null;
  const pos = e=>{ const r=pad.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  pad.addEventListener('pointerdown', e=>{ e.preventDefault(); drawing=true; last=pos(e); markDirty(); });
  pad.addEventListener('pointermove', e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
  window.addEventListener('pointerup', ()=>{ drawing=false; });
}
function markDirty(){ if(!sigDirty){ sigDirty=true; $('sigHint').style.display='none'; refreshFinish(); } }
function clearSig(){ ctx.clearRect(0,0,pad.width,pad.height); sigDirty=false; $('sigHint').style.display='flex'; refreshFinish(); }
function refreshFinish(){ const b=$('finishBtn'); if(b) b.disabled = !(sigDirty && state.acks.sec); }

/* Auto-send: fires for every completed record — pass or fail. */
async function autoSend(rec){
  rec.sendStatus = 'sending';
  try{
    const bytes = await buildPacket(rec);
    if(SEND_WEBHOOK){
      const pdfBase64 = btoa(String.fromCharCode(...new Uint8Array(bytes)));
      await fetch(SEND_WEBHOOK, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({record:{...rec, signature:undefined}, pdfBase64,
          emailCopyTo: rec.emailCopyTo||null})});
      rec.sendStatus = 'sent';
    } else {
      rec.sendStatus = 'sent (simulated — test build)'; // DEPLOY: set SEND_WEBHOOK to the Power Automate flow URL
    }
    rec.sentAt = new Date().toISOString();
  }catch(e){ rec.sendStatus = 'send failed: '+e.message; }
  const el = document.getElementById('sendStatus');
  if(el) el.textContent = sendStatusLabel(rec);
}
function sendStatusLabel(rec){
  if(!rec.sendStatus || rec.sendStatus==='sending') return lang==='es'?'Enviando a Spark…':'Sending to Spark…';
  if(rec.sendStatus.startsWith('sent')) return lang==='es'?'Enviado al equipo de Spark':'Sent to the Spark team';
  return rec.sendStatus;
}
function saveRecord(status){
  const trainSecs = Object.values(state.neo.seconds).reduce((a,b)=>a+b,0);
  sessionRecords.push({
    status, associate:{...state.associate}, language:lang,
    startedAt:state.startedAt, completedAt:state.completedAt,
    neoSecondsTotal:trainSecs, neoSecondsByModule:{...state.neo.seconds},
    quiz:JSON.parse(JSON.stringify(state.quiz)),
    acknowledged:Object.keys(state.acks).filter(k=>state.acks[k]),
    signature:state.signature || null,
    signatureCaptured:!!state.signature
  });
  /* DEPLOY PIPELINE:
     1. buildPacket(record) -> PDF bytes (already working, below)
     2. POST { record, pdfBase64 } to a Power Automate flow
        ("When an HTTP request is received" trigger)
     3. Flow: save PDF to SharePoint employee-file library
        -> email packet to Spark onboarding inbox (+ CPP if required)
        -> Salesforce: create ContentVersion + ContentDocumentLink
           on the candidate record (invite carries sfRecordId)
     4. Supabase insert of the record for the admin dashboard   */
}
/* ---------------- PDF packet (pdf-lib, client-side) ---------------- */
function pdfSafe(s){
  return stripHtml(String(s))
    .replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"')
    .replace(/[\u2014\u2013]/g,'-').replace(/\u00b7/g,'-')
    .replace(/[^\x00-\xFF]/g,'').replace(/\s+/g,' ').trim();
}
async function buildPacket(rec){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  const reg = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const INK = rgb(0.08,0.08,0.09), GOLD = rgb(0.79,0.61,0.14), MUT = rgb(0.42,0.40,0.36),
        GREEN = rgb(0.18,0.49,0.27), RED = rgb(0.70,0.22,0.16);
  const M = 54, PW = 612, PH = 792, W = PW - 2*M;
  let page, y;
  const stripe = ()=>{ for(let x=0;x<PW;x+=24){ page.drawRectangle({x, y:PH-10, width:12, height:10, color:GOLD}); page.drawRectangle({x:x+12, y:PH-10, width:12, height:10, color:INK}); } };
  const newPage = ()=>{ page = doc.addPage([PW,PH]); y = PH - 44; stripe();
    page.drawText('SPARK COMPANIES\u00AE  \u00B7  VI-JON ONBOARDING', {x:M, y:PH-32, size:8, font:bold, color:MUT});
    page.drawText(pdfSafe(rec.associate.name)+'  \u00B7  '+new Date(rec.completedAt).toLocaleDateString(), {x:PW-M-200, y:PH-32, size:8, font:reg, color:MUT, maxWidth:200});
  };
  const ensure = h=>{ if(y - h < 56) newPage(); };
  const write = (t, o={})=>{
    const size=o.size||10.5, f=o.bold?bold:reg, color=o.color||INK, indent=o.indent||0, gap=o.gap??5;
    const words = pdfSafe(t).split(' '); let line=''; const lines=[];
    for(const w of words){ const test=line?line+' '+w:w;
      if(f.widthOfTextAtSize(test,size) > W-indent){ lines.push(line); line=w; } else line=test; }
    if(line) lines.push(line);
    for(const ln of lines){ ensure(size+4); page.drawText(ln,{x:M+indent, y:y-size, size, font:f, color}); y -= size+3.5; }
    y -= gap;
  };
  const head = (t)=>{ ensure(30); write(t,{size:15,bold:true,gap:3}); page.drawLine({start:{x:M,y}, end:{x:M+W,y}, thickness:2, color:INK}); y-=12; };
  const kv = (k,v)=>{ ensure(16); page.drawText(pdfSafe(k).toUpperCase(),{x:M,y:y-9,size:8,font:bold,color:MUT}); page.drawText(pdfSafe(v),{x:M+150,y:y-10,size:10.5,font:reg,color:INK}); y-=17; };
  const sigBlock = async (label)=>{
    ensure(96);
    if(rec.signature){
      try{ const png = await doc.embedPng(await (await fetch(rec.signature)).arrayBuffer());
        const dims = png.scaleToFit(200,64);
        page.drawImage(png,{x:M, y:y-dims.height, width:dims.width, height:dims.height}); y -= dims.height+2;
      }catch(e){ write('[signature image unavailable]',{color:MUT}); }
    } else { write('No signature captured - record closed at test lockout.',{color:RED,bold:true}); }
    page.drawLine({start:{x:M,y}, end:{x:M+260,y}, thickness:1, color:INK}); y-=12;
    write(`${rec.associate.name}   \u00B7   Badge ${rec.associate.badge||'-'}   \u00B7   ${new Date(rec.completedAt).toLocaleDateString()}   \u00B7   ${label}`,{size:9,color:MUT,gap:10});
  };

  /* ---- cover ---- */
  newPage();
  try{
    const sp = await doc.embedPng(await (await fetch(LOGO_SPARK)).arrayBuffer());
    const vj = await doc.embedPng(await (await fetch(LOGO_VIJON)).arrayBuffer());
    const sd = sp.scaleToFit(150, 44), vd = vj.scaleToFit(56, 44);
    page.drawImage(sp, {x:M, y:y-44, width:sd.width, height:sd.height});
    page.drawImage(vj, {x:PW-M-vd.width, y:y-44, width:vd.width, height:vd.height});
    y -= 60;
  }catch(e){ /* logos optional */ }
  y -= 8;
  write('VI-JON TEMPORARY ASSOCIATE',{size:11,bold:true,color:MUT,gap:2});
  write('ONBOARDING RECORD',{size:24,bold:true,gap:4});
  const passed = rec.status==='QUALIFIED';
  write(passed?'STATUS: PASSED - AWAITING RECRUITER NEXT STEPS':'STATUS: '+rec.status,{size:11,bold:true,color:passed?GREEN:RED,gap:14});
  kv('Associate', rec.associate.name);
  kv('Badge #', rec.associate.badge||'-');
  kv('Agency', rec.associate.agency);
  kv('Shift', rec.associate.shift||'-');
  kv('Access code', rec.associate.code||'-');
  kv('Started', new Date(rec.startedAt).toLocaleString());
  kv('Completed', new Date(rec.completedAt).toLocaleString());
  kv('Orientation time', (Math.round(rec.neoSecondsTotal/60*10)/10)+' minutes');
  kv('Language used', rec.language==='es'?'Spanish':'English');
  y -= 6;
  write('DOCUMENTS COMPLETED AND ACKNOWLEDGED',{size:10,bold:true,color:MUT,gap:6});
  const docsList = ['NEO Safety Orientation (8 modules, knowledge-checked)','Packaging Safety Guidelines - Required Agency Training','Gowning Instructions','cGMP Training'];
  if(rec.quiz.attempts.length) docsList.push(`cGMP Training Test - ${rec.quiz.attempts.map(a=>`v${a.version}: ${a.pct}%`).join(', ')}`);
  if(rec.acknowledged.includes('lunch')) docsList.push('Lunch & Break Time Disclosure');
  if(rec.acknowledged.includes('sec')) docsList.push('Building Security Acknowledgment');
  docsList.forEach(d=>write('\u2713  '+d,{indent:6,gap:2}));
  y -= 14;
  await sigBlock('Onboarding record');

  /* ---- building security ---- */
  if(rec.acknowledged.includes('sec')){
    newPage();
    head('Building Security Acknowledgment');
    write(SECURITY.en.intro,{gap:8});
    SECURITY.en.donots.forEach(d=>write(stripHtml(d),{bold:true,indent:10,gap:3}));
    y -= 5;
    write(SECURITY.en.lost,{gap:6});
    write(SECURITY.en.closing,{bold:true,gap:16});
    await sigBlock('Building Security Acknowledgment');
  }

  /* ---- graded test sheets ---- */
  for(let ai=0; ai<rec.quiz.attempts.length; ai++){
    const att = rec.quiz.attempts[ai];
    const test = TESTS[att.version];
    if(!test || !att.answers) continue;
    newPage();
    head(`${test.name} - Attempt ${ai+1} of ${MAX_ATTEMPTS}`);
    write(`Score: ${att.score} / ${att.total}  (${att.pct}%)   \u00B7   ${att.passed?'PASSED':'NOT PASSED'} (${PASS_PCT}% required)   \u00B7   ${new Date(att.at).toLocaleString()}`,{bold:true,color:att.passed?GREEN:RED,gap:12});
    test.questions.forEach((q,qi)=>{
      ensure(46);
      write(`${qi+1}. ${q.q}`,{bold:true,gap:2});
      const given = att.answers[qi];
      const ok = given===q.a;
      write(`Answer given: ${'ABC'[given]||'-'}. ${q.o[given]||'-'}  ${ok?'[CORRECT]':''}`,{indent:12,gap:ok?7:2,color:ok?GREEN:RED});
      if(!ok) write(`Correct answer: ${'ABC'[q.a]}. ${q.o[q.a]}`,{indent:12,gap:7,color:MUT});
    });
  }

  /* ---- acknowledgments page ---- */
  newPage();
  head('Training Acknowledgments');
  write('The associate reviewed each item below in full and acknowledged understanding within the Spark onboarding portal. Section dwell time and comprehension checks were enforced.',{color:MUT,gap:10});
  const ackAt = new Date(rec.completedAt).toLocaleString();
  SAFETY_SECTIONS.forEach((s,i)=>{ if(rec.acknowledged.includes('saf'+i)) write(`\u2713  Packaging Safety Guidelines - ${s.title}  \u00B7  acknowledged ${ackAt}`,{gap:3}); });
  if(rec.acknowledged.includes('gown')) write(`\u2713  Gowning Instructions  \u00B7  acknowledged ${ackAt}`,{gap:3});
  if(rec.acknowledged.includes('cgmp')) write(`\u2713  cGMP Training material  \u00B7  acknowledged ${ackAt}`,{gap:3});
  if(rec.acknowledged.includes('lunch')) write(`\u2713  Lunch & Break Time Disclosure  \u00B7  acknowledged ${ackAt}`,{gap:3});
  y -= 16;
  await sigBlock('Training acknowledgments');

  return await doc.save();
}
async function downloadPacket(rec, btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Building PDF...'; }
  try{
    const bytes = await buildPacket(rec);
    const blob = new Blob([bytes], {type:'application/pdf'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ViJon-Onboarding-${rec.associate.name.replace(/\s+/g,'_')}-${rec.associate.code||''}.pdf`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){ alert('PDF build failed: '+e.message); }
  if(btn){ btn.disabled = false; btn.textContent = 'Download PDF packet'; }
}

function renderDone(flagged){
  const rIdx = sessionRecords.length-1;
  const r = sessionRecords[rIdx];
  const items = flagged
    ? ['NEO Safety Orientation','Packaging Safety Guidelines','Gowning Instructions','cGMP Training']
    : ['NEO Safety Orientation','Packaging Safety Guidelines','Gowning Instructions','cGMP Training',`cGMP Test — ${state.quiz.finalScore}% (attempt ${state.quiz.attempts.length})`,'Lunch & Break Time Disclosure','Building Security Acknowledgment','Signature captured'];
  document.querySelector('.stepper').classList.add('hide');
  main.innerHTML = `<div class="card fadein">
    <div class="signbar ${flagged?'sign-danger':'sign-safe'}"><span class="sign-word">${flagged?'Not Qualified':'Record Complete'}</span><span class="sign-note">${new Date().toLocaleDateString()}</span></div>
    <div class="card-pad" style="text-align:center">
    <div class="stamp ${flagged?'bad':''}">${flagged?'NOT QUALIFIED':(lang==='es'?'APROBADO':'PASSED')}</div>
    ${flagged
      ? `<p class="sub">The cGMP test was not passed within ${MAX_ATTEMPTS} attempts. Per client requirements this placement cannot proceed. Your record has been sent to Spark — your recruiter will follow up with you.</p>`
      : `<h1>${lang==='es'?'Aprobado':'You passed'}</h1>
         <p class="sub">${lang==='es'
           ?'Su registro de incorporaci\u00f3n est\u00e1 completo. Por favor espere los pr\u00f3ximos pasos de su reclutador.'
           :'Your onboarding record is complete. Please wait for next steps from your recruiter.'}</p>`}
    <div class="checkline" style="justify-content:center;font-weight:600"><span id="sendStatus">${sendStatusLabel(r)}</span></div>
    <div style="text-align:left;max-width:440px;margin:10px auto 0">
      ${items.map(i=>`<div class="checkline">${I.check}<span>${i}</span></div>`).join('')}
    </div>
    <div class="rec">
      <div class="rec-head"></div>
      <div class="rec-inner">
      <h3>${lang==='es'?'\u00bfQuiere una copia de sus documentos?':'Want a copy of your documents?'}</h3>
      <p class="sub" style="font-size:14px;margin-bottom:10px">${lang==='es'
        ?'Opcional. Escriba su correo electr\u00f3nico y le enviaremos su paquete de incorporaci\u00f3n.'
        :'Optional. Enter your email and we will send you your onboarding packet.'}</p>
      <div class="field" style="margin-bottom:8px"><input id="fCopyEmail" type="email" autocomplete="off" placeholder="name@email.com"></div>
      <button class="btn btn-ghost" style="width:100%" onclick="requestCopy(${rIdx}, this)">${lang==='es'?'Enviarme una copia':'Email me a copy'}</button>
      </div>
    </div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-gold" style="min-width:200px" onclick="closeOut()">${lang==='es'?'Terminar':'Done'} ${I.check}</button>
    </div>
  </div></div>`;
}
function requestCopy(idx, btn){
  const em = ($('fCopyEmail').value||'').trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ alert(lang==='es'?'Ingrese un correo v\u00e1lido.':'Please enter a valid email.'); return; }
  sessionRecords[idx].emailCopyTo = em;
  /* DEPLOY: the Power Automate flow reads emailCopyTo from the payload and
     sends the associate their packet. If they add it after auto-send, re-POST. */
  if(SEND_WEBHOOK) autoSend(sessionRecords[idx]);
  btn.textContent = (lang==='es'?'Copia en camino a ':'Copy on its way to ')+em;
  btn.disabled = true;
}
function closeOut(){
  window.close(); // works in kiosk/app-opened windows; browsers may block tabs the user opened
  setTimeout(()=>{
    let secs = 12;
    document.querySelector('.stepper').classList.add('hide');
    main.innerHTML = `<div class="card fadein" style="max-width:520px;margin:40px auto;text-align:center">
      <div class="signbar sign-safe"><span class="sign-word">${lang==='es'?'Completado':'All Done'}</span><span class="sign-note">Spark Companies&reg;</span></div>
      <div class="card-pad">
        <h1>${lang==='es'?'Ya puede cerrar esta ventana':'You can close this window'}</h1>
        <p class="sub">${lang==='es'?'Gracias. Su reclutador de Spark se comunicar\u00e1 con usted.':'Thank you. Your Spark recruiter will be in touch.'}</p>
        <p class="sub" style="font-size:13.5px;color:#9a9585">${lang==='es'?'Reiniciando para el siguiente asociado en':'Resetting for the next associate in'} <span class="mono" id="cdown">${secs}</span>s</p>
      </div></div>`;
    const t = setInterval(()=>{
      secs--; const el = $('cdown');
      if(!el){ clearInterval(t); return; }
      el.textContent = secs;
      if(secs<=0){ clearInterval(t); resetFlow(); }
    },1000);
  }, 250);
}
function resetFlow(){
  Object.assign(state,{associate:{name:'',badge:'',agency:'Spark Talent Acquisition',shift:'',code:''},startedAt:null,neo:{module:0,done:[],seconds:{},checks:{}},quiz:{attempts:[],versionsUsed:[],passed:false,finalScore:null,locked:false},acks:{},signature:null,completedAt:null});
  sigDirty=false; currentTest=null; answers=[]; optMaps=[];
  document.querySelector('.stepper').classList.remove('hide');
  go(0);
}

/* ---------------- admin: PIN gate + access code + records ---------------- */
function showAdmin(){
  document.querySelector('.stepper').classList.add('hide');
  if(!adminAuthed){ renderAdminPin(); } else { renderAdmin(); }
}
function renderAdminPin(){
  main.innerHTML = `<div class="card fadein" style="max-width:440px;margin:24px auto">
    <div class="signbar sign-ink"><span class="sign-word">Spark Admin</span><span class="sign-note">Staff Only</span></div>
    <div class="card-pad">
      <p class="sub">Enter the staff PIN. Test build uses <b class="mono">${ADMIN_PIN}</b> — this becomes your Microsoft 365 staff login at deploy.</p>
      <div class="field"><label>PIN</label>
        <input id="adminPin" type="password" inputmode="numeric" maxlength="6" style="font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:.35em;text-align:center"></div>
      <div class="kc-feedback no" id="pinErr" style="min-height:22px"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="exitAdmin()">Back</button>
        <button class="btn btn-dark" onclick="checkPin()">Unlock</button>
      </div>
    </div>
  </div>`;
  const p=$('adminPin'); p.focus();
  p.addEventListener('keydown', e=>{ if(e.key==='Enter') checkPin(); });
}
function checkPin(){
  if($('adminPin').value === ADMIN_PIN){ adminAuthed = true; renderAdmin(); }
  else $('pinErr').textContent = 'Wrong PIN.';
}
function renderAdmin(){
  const recRows = sessionRecords.length
    ? sessionRecords.map((r,idx)=>`<div class="rec" style="margin-bottom:14px"><div class="rec-head"></div><div class="rec-inner"><h3>${r.associate.name} · ${r.status}</h3>
        <div class="rec-row"><span class="k">Badge</span><span class="v mono">${r.associate.badge}</span></div>
        <div class="rec-row"><span class="k">Agency / shift</span><span class="v">${r.associate.agency}${r.associate.shift?' · '+r.associate.shift:''}</span></div>
        <div class="rec-row"><span class="k">Orientation time</span><span class="v mono">${Math.round(r.neoSecondsTotal/60*10)/10} min</span></div>
        <div class="rec-row"><span class="k">Attempts</span><span class="v mono">${r.quiz.attempts.map(a=>`v${a.version}:${a.pct}%`).join(' · ')||'—'}</span></div>
        <div class="rec-row"><span class="k">Signature</span><span class="v">${r.signatureCaptured?'captured':'—'}</span></div>
        <div class="rec-row"><span class="k">Sent to Spark</span><span class="v">${r.sendStatus||'—'}${r.emailCopyTo?'<br>copy → '+r.emailCopyTo:''}</span></div>
        <div class="rec-row"><span class="k">Completed</span><span class="v mono">${new Date(r.completedAt).toLocaleString()}</span></div>
        <div style="margin-top:12px"><button class="btn btn-gold" style="padding:9px 18px;font-size:13px" onclick="downloadPacket(sessionRecords[${idx}], this)">Download PDF packet</button></div>
        </div></div>`).join('')
    : `<p class="sub">No completion records this session yet.</p>`;

  main.innerHTML = `
  <div class="card fadein">
    <div class="signbar sign-ink"><span class="sign-word">Access Code</span><span class="sign-note">Spark Admin</span></div>
    <div class="card-pad">
      <p class="sub">One standing code gates the portal. Give it to associates with the link, or send the link as <span class="mono" style="font-size:13px">?c=${siteCode}</span> to prefill it. Rotate it any time — per client, per season, or if it leaks.</p>
      <div class="grid2" style="align-items:end">
        <div class="field" style="margin-bottom:0"><label>Current code</label>
          <input id="aCode" value="${siteCode}" maxlength="8" spellcheck="false" autocomplete="off"
            style="font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:.35em;text-transform:uppercase"></div>
        <div class="btn-row" style="margin-top:0;gap:10px">
          <button class="btn btn-ghost" onclick="$('aCode').value = genCode(6)">Randomize</button>
          <button class="btn btn-gold" onclick="saveSiteCode(this)">Save</button>
        </div>
      </div>
      <div class="kc-feedback no" id="codeAdminErr" style="min-height:20px"></div>
    </div>
  </div>

  <div class="card fadein">
    <div class="signbar sign-ink"><span class="sign-word">Records</span><span class="sign-note">Employee File</span></div>
    <div class="card-pad">
      <p class="sub">Every completed record — pass or fail — auto-sends to Spark: PDF packet to SharePoint, email to the team, and attached to the Salesforce record. Test build sends are simulated.</p>
      ${recRows}
      <div class="btn-row"><button class="btn btn-ghost" onclick="exitAdmin()">Back to portal</button><span></span></div>
    </div>
  </div>`;
}
function saveSiteCode(btn){
  const c = normCode($('aCode').value);
  if(c.length < 4){ $('codeAdminErr').textContent = 'Code must be at least 4 characters (A-Z, 2-9).'; return; }
  siteCode = c;
  $('aCode').value = c;
  $('codeAdminErr').textContent = '';
  btn.textContent = 'Saved';
  setTimeout(()=>btn.textContent='Save', 1600);
  /* DEPLOY: persist to Supabase site_config so every kiosk/device picks it up. */
}
function exitAdmin(){ document.querySelector('.stepper').classList.remove('hide'); renderStepper(); render(); }

/* ---------------- shared ---------------- */
function ackToggle(key, el){
  state.acks[key] = el.checked;
  const y = window.scrollY;
  render();
  window.scrollTo({top:y});
}
function navRow(prevStep, nextStep, gate){
  const ok = gate();
  return `<div class="btn-row">
    <button class="btn btn-ghost" onclick="go(${prevStep})">${T[lang].back}</button>
    <button class="btn btn-gold" ${ok?'':'disabled'} onclick="go(${nextStep})">${T[lang].next} ${I.check}</button>
  </div>`;
}

/* ---------------- router ---------------- */
function render(){
  switch(step){
    case 0: renderCheckIn(); break;
    case 1: renderNeo(); break;
    case 2: renderSafety(); break;
    case 3: renderGowning(); break;
    case 4: renderCgmp(); break;
    case 5: renderQuiz(); break;
    case 6: renderDisclosures(); break;
    case 7: renderSignoff(); break;
  }
}
renderStepper(); render();
</script>
